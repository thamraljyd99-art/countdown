<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الزواج الجماعي الأول لخامس المساعدة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cairo',sans-serif;
background:#000;
color:#fff;
min-height:100vh;
overflow:hidden;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(
rgba(0,0,0,.88),
rgba(0,0,0,.88)
),
url('logo.png.PNG');

background-repeat:no-repeat;
background-position:center center;
background-size:55%;
opacity:.18;

z-index:1;
}

.content{
position:relative;
z-index:2;

height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding:20px;
}

.title{

font-family:'Amiri',serif;

font-size:58px;
font-weight:700;

color:#f5d77a;

text-align:center;
line-height:1.5;

text-shadow:
0 0 10px rgba(245,215,122,.4),
0 0 25px rgba(245,215,122,.3);

margin-bottom:30px;

}

.decor{
width:260px;
height:2px;
background:#d4af37;
box-shadow:0 0 12px #d4af37;
margin:18px auto;
}

.countdown-box{

background:rgba(0,0,0,.45);

border:1px solid rgba(245,215,122,.45);

border-radius:22px;

padding:30px 40px;

backdrop-filter:blur(8px);

box-shadow:
0 0 25px rgba(212,175,55,.15);

}

#countdown{

font-family:'Cairo',sans-serif;

font-size:40px;
font-weight:bold;

color:#ffffff;

line-height:1.9;

text-align:center;

}

.footer{

margin-top:25px;

font-size:18px;

color:#d4af37;

}

@media(max-width:768px){

.title{
font-size:38px;
}

#countdown{
font-size:28px;
}

.countdown-box{
padding:20px;
}

.decor{
width:180px;
}

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="content">

<div class="decor"></div>

<h1 class="title">
الزواج الجماعي الأول<br>
لخامس المساعدة
</h1>

<div class="decor"></div>

<div class="countdown-box">

<div id="countdown"></div>

</div>

</div>

<script>

const targetDate =
new Date("2026-07-12T00:00:00+03:00");

function updateCountdown(){

const now = new Date();

const diff = targetDate - now;

const days =
Math.floor(diff / (1000*60*60*24));

const hours =
Math.floor(
(diff % (1000*60*60*24))
/
(1000*60*60)
);

const minutes =
Math.floor(
(diff % (1000*60*60))
/
(1000*60)
);

const seconds =
Math.floor(
(diff % (1000*60))
/
1000
);

document.getElementById("countdown").innerHTML =

days + " يوم<br>" +
hours + " ساعة<br>" +
minutes + " دقيقة<br>" +
seconds + " ثانية";

}

setInterval(updateCountdown,1000);

updateCountdown();

</script>

</body>
</html>
