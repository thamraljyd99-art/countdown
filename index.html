<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الزواج الجماعي الأول لخامس المساعدة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:'Cairo',sans-serif;
overflow:hidden;
color:white;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.45)
),
url('logo.PNG');

background-repeat:no-repeat;
background-position:center center;
background-size:105%;

z-index:1;
}

.content{
position:relative;
z-index:2;

min-height:100vh;

display:flex;
flex-direction:column;
align-items:center;

padding-top:0px;
}

.decor{
width:260px;
height:2px;

background:#d4af37;

box-shadow:
0 0 10px #d4af37,
0 0 20px #d4af37;

margin:15px 0;
}

.title{

font-family:'Amiri',serif;

font-size:58px;

font-weight:bold;

color:#f5d77a;

text-align:center;

line-height:1.4;

text-shadow:
0 0 12px rgba(245,215,122,.6),
0 0 30px rgba(245,215,122,.4);

}

.logo-space{
height:220px;
}

#countdown{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:10px;

width:95%;

max-width:520px;

margin-top:120px;

}

.time-box{

background:
rgba(0,0,0,.55);

border:
1px solid rgba(245,215,122,.5);

border-radius:20px;

padding:20px 10px;

text-align:center;

box-shadow:
0 0 20px rgba(212,175,55,.20);

}

.number{

font-size:46px;

font-weight:bold;

color:#f5d77a;

}

.label{

margin-top:8px;

font-size:18px;

color:white;

}

@media(max-width:768px){

.title{
font-size:42px;
}

.logo-space{
height:220px;
}

.number{
font-size:34px;
}

.label{
font-size:15px;
}

.time-box{
padding:15px 6px;
}

}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="content">

<div class="decor"></div>

<h1 class="title">
الزواج الجماعي الأول<br>
لخامس المساعدة
</h1>

<div class="decor"></div>

<div class="logo-space"></div>

<div id="countdown"></div>

</div>

<script>

const targetDate =
new Date("2026-07-12T00:00:00+03:00");

function updateCountdown(){

const now = new Date();

const diff = targetDate - now;

const days =
Math.floor(diff/(1000*60*60*24));

const hours =
Math.floor(
(diff%(1000*60*60*24))
/
(1000*60*60)
);

const minutes =
Math.floor(
(diff%(1000*60*60))
/
(1000*60)
);

const seconds =
Math.floor(
(diff%(1000*60))
/
1000
);

document.getElementById("countdown").innerHTML =

'<div class="time-box"><div class="number">'+days+'</div><div class="label">يوم</div></div>' +

'<div class="time-box"><div class="number">'+hours+'</div><div class="label">ساعة</div></div>' +

'<div class="time-box"><div class="number">'+minutes+'</div><div class="label">دقيقة</div></div>' +

'<div class="time-box"><div class="number">'+seconds+'</div><div class="label">ثانية</div></div>';

}

updateCountdown();

setInterval(updateCountdown,1000);

</script>

</body>
</html>
