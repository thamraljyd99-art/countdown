<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الزواج الجماعي الأول لخامس المساعدة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cairo',sans-serif;
background:#000;
color:#fff;
min-height:100vh;
overflow:hidden;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(
rgba(0,0,0,.88),
rgba(0,0,0,.88)
),
url('logo.png.PNG');

background-repeat:no-repeat;
background-position:center center;
background-size:75%;
opacity:.30;

z-index:1;
}

.content{
position:relative;
z-index:2;

height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding:20px;
}

.title{
font-family:'Amiri',serif;

font-size:42px;
font-weight:700;

color:#f5d77a;

text-align:center;
line-height:1.6;

text-shadow:
0 0 10px rgba(245,215,122,.4),
0 0 25px rgba(245,215,122,.3);

margin-bottom:25px;
}

.decor{
width:220px;
height:2px;
background:#d4af37;
box-shadow:0 0 12px #d4af37;
margin:18px auto;
}

#countdown{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
max-width:450px;
}

.time-box{
width:95px;
padding:15px 10px;

background:rgba(0,0,0,.55);

border:1px solid rgba(245,215,122,.5);

border-radius:15px;

box-shadow:
0 0 15px rgba(212,175,55,.15);
}

.number{
font-size:38px;
font-weight:bold;
color:#f5d77a;
}

.label{
font-size:18px;
margin-top:8px;
color:white;
}

@media(max-width:768px){

.title{
font-size:34px;
}

.time-box{
width:85px;
}

.number{
font-size:30px;
}

.label{
font-size:16px;
}

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="content">

<div class="decor"></div>

<h1 class="title">
الزواج الجماعي الأول<br>
لخامس المساعدة
</h1>

<div class="decor"></div>

<div id="countdown"></div>

</div>

<script>

const targetDate =
new Date("2026-07-12T00:00:00+03:00");

function updateCountdown(){

const now = new Date();

const diff = targetDate - now;

const days =
Math.floor(diff / (1000*60*60*24));

const hours =
Math.floor(
(diff % (1000*60*60*24))
/
(1000*60*60)
);

const minutes =
Math.floor(
(diff % (1000*60*60))
/
(1000*60)
);

const seconds =
Math.floor(
(diff % (1000*60))
/
1000
);

document.getElementById("countdown").innerHTML =

'<div class="time-box"><div class="number">'+days+'</div><div class="label">يوم</div></div>' +

'<div class="time-box"><div class="number">'+hours+'</div><div class="label">ساعة</div></div>' +

'<div class="time-box"><div class="number">'+minutes+'</div><div class="label">دقيقة</div></div>' +

'<div class="time-box"><div class="number">'+seconds+'</div><div class="label">ثانية</div></div>';

}

setInterval(updateCountdown,1000);

updateCountdown();

</script>

</body>
</html>
